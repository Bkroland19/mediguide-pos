name: user_app
description: "MediGuide Mobile Application"
publish_to: "none"

version: 2.0.19+46

# ============================================================
# ENVIRONMENT
# ============================================================

environment:
  sdk: ^3.8.1

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # STATE MANAGEMENT
  # ==========================================================

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ==========================================================
  # ROUTING
  # ==========================================================

  go_router: ^16.2.4

  # ==========================================================
  # NETWORKING
  # ==========================================================

  dio: ^5.11.0
  crypto: ^3.0.6
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^3.1.1

  # ==========================================================
  # OFFLINE / LOCAL DATABASE
  # ==========================================================

  # Keep runtime and generator aligned with Riverpod 2.x's source_gen range.
  # Upgrade Drift and Riverpod generators together in a dedicated migration.
  drift: 2.27.0

  path: ^1.9.1
  path_provider: ^2.1.5

  # ==========================================================
  # LOCAL KEY/VALUE STORAGE
  # ==========================================================

  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1

  # ==========================================================
  # SERIALIZATION / MODELS
  # ==========================================================

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ==========================================================
  # UI / DESIGN SYSTEM
  # ==========================================================

  flex_color_scheme: ^8.4.0
  lucide_icons_flutter: ^3.1.9
  gap: ^3.0.1
  responsive_framework: ^1.5.1
  universal_image: ^1.0.11

  # ==========================================================
  # FORMS
  # ==========================================================

  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  form_builder_phone_field: ^3.0.0

  # ==========================================================
  # AUTH / SECURITY
  # ==========================================================

  local_auth: ^3.0.2

  # ==========================================================
  # HTML / WEB CONTENT
  # ==========================================================

  flutter_inappwebview: ^6.1.5
  flutter_html: ^3.0.0

  # ==========================================================
  # PAGINATION / TREE UI
  # ==========================================================

  infinite_scroll_pagination: ^5.1.1
  animated_tree_view: ^2.3.0

  # ==========================================================
  # APP LIFECYCLE / BACKGROUND SYNC
  # ==========================================================

  workmanager: ^0.9.0+3

  # ==========================================================
  # DEVICE / FILES
  # ==========================================================

  file_picker: ^10.3.10
  flutter_pdfview: ^1.4.4
  url_launcher: ^6.3.2

  # ==========================================================
  # APP UPDATE / REVIEW
  # ==========================================================

  in_app_update: ^5.0.0
  in_app_review: ^2.0.11

  # ==========================================================
  # AI
  # ==========================================================

  flutter_gen_ai_chat_ui: ^2.5.0
  openai_dart: ^7.0.1

  # ==========================================================
  # OTHER UI
  # ==========================================================

  expansion_tile_group: ^2.3.0
  bubble: ^1.2.1
  introduction_screen: ^4.0.0
  toastification: ^3.0.3

  # ==========================================================
  # UTILITIES
  # ==========================================================

  intl: ^0.20.2
  event_bus: ^2.0.1

# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

dev_dependencies:
  sqlite3: ^2.9.4
  flutter_test:
    sdk: flutter

  # ==========================================================
  # CODE GENERATION
  # ==========================================================

  build_runner: ^2.4.15

  # Riverpod code generation
  riverpod_generator: ^2.6.5

  # Drift database generation
  drift_dev: 2.27.0

  # Freezed / JSON generation
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  # ==========================================================
  # LINTING
  # ==========================================================

  flutter_lints: ^6.0.0
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

  # ==========================================================
  # BUILD UTILITIES
  # ==========================================================

  package_rename: ^1.10.1
  icons_launcher: ^3.0.3

# ============================================================
# FLUTTER
# ============================================================

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  # ==========================================================
  # ASSETS
  # ==========================================================

  assets:
    - assets/

  # ==========================================================
  # FONTS
  # ==========================================================

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Thin.ttf
          weight: 100

        - asset: assets/fonts/Geist-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Geist-Light.ttf
          weight: 300

        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400

        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500

        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700

        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/Geist-Black.ttf
          weight: 900
