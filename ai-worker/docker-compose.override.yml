services:
  ai-worker:
    build: ../ai-worker
    environment:
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      S3_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
      - minio
      - redis
      - ollama
    ports:
      - "8090:8090"

  ai-worker-loop:
    build: ../ai-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      S3_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
      - minio
      - redis
      - ollama

  # Local Ollama runtime. Pull the embedding and generation models manually after startup:
  # docker exec -it <ollama-container> ollama pull mxbai-embed-large:latest
  # docker exec -it <ollama-container> ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
