services:
  ai-worker:
    build: ../ai-worker
    environment:
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      S3_ENDPOINT: minio:9000
      CHUNK_SIZE: ${CHUNK_SIZE:-320}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
      MIN_CHUNK_CHARS: ${MIN_CHUNK_CHARS:-120}
      EMBEDDING_REQUEST_BATCH_SIZE: ${EMBEDDING_REQUEST_BATCH_SIZE:-8}
      # Temporary default: use Ollama running on the host machine.
      # To switch back to the Docker Ollama service later, set:
      # OLLAMA_BASE_URL=http://ollama:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - postgres
      - minio
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"

  ai-worker-loop:
    build: ../ai-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      S3_ENDPOINT: minio:9000
      CHUNK_SIZE: ${CHUNK_SIZE:-320}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-60}
      MIN_CHUNK_CHARS: ${MIN_CHUNK_CHARS:-120}
      EMBEDDING_REQUEST_BATCH_SIZE: ${EMBEDDING_REQUEST_BATCH_SIZE:-8}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - postgres
      - minio
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional Docker Ollama runtime for later use.
  # Enable it with: docker compose --profile docker-ollama up
  # and set OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
