name: Test and build mobile release

on:
  pull_request:
    branches:
      - main
    paths:
      - "user_app/**"
      - ".github/workflows/mobile-release.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "user_app/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API URL embedded in the release builds
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.44.8
  MOBILE_API_BASE_URL: ${{ inputs.api_base_url || vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}

jobs:
  quality:
    name: Test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag matches the mobile version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-release-readiness.sh "${GITHUB_REF_NAME}" --metadata-only

      - name: Verify generated backend contracts
        run: |
          dart run tool/generate_backend_contracts.dart
          dart format lib/core/network/contracts/generated/backend_contracts.dart
          git diff --exit-code -- lib/core/network/contracts/generated/backend_contracts.dart

      - name: Verify generated Dart models
        run: |
          if [ -n "$(git ls-files '*.g.dart' '*.freezed.dart')" ]; then
            echo "Generated *.g.dart and *.freezed.dart files must not be committed." >&2
            git ls-files '*.g.dart' '*.freezed.dart' >&2
            exit 1
          fi
          dart run build_runner build --delete-conflicting-outputs
          dart format lib
          git diff --exit-code -- lib

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-${{ github.run_id }}
          path: user_app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload golden comparison failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-golden-failures-${{ github.run_id }}
          path: user_app/test/failures
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Build Android artifacts
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    # Release builds compile both an APK and an app bundle. A cold hosted
    # runner can exceed one hour while Gradle warms its caches.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64}" ] || \
             [ -z "${ANDROID_UPLOAD_STORE_PASSWORD}" ] || \
             [ -z "${ANDROID_UPLOAD_KEY_ALIAS}" ] || \
             [ -z "${ANDROID_UPLOAD_KEY_PASSWORD}" ]; then
            echo "Android release-signing secrets are incomplete." >&2
            exit 1
          fi
          if ! printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "The decoded Android upload keystore is empty." >&2
            exit 1
          fi
          chmod 600 android/app/upload-keystore.jks
          if ! keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" \
            -alias "${ANDROID_UPLOAD_KEY_ALIAS}" >/dev/null; then
            echo "The Android upload keystore, password, or alias is invalid." >&2
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_UPLOAD_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_UPLOAD_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_UPLOAD_KEY_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Build release app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-android-${{ github.run_id }}
          path: |
            user_app/build/app/outputs/flutter-apk/app-release.apk
            user_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  web:
    name: Build web artifact
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web release
        run: |
          bash tool/prepare_web_database.sh
          flutter build web --release \
            --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-web-${{ github.run_id }}
          path: user_app/build/web
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  apple:
    name: Build unsigned Apple artifacts
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS app
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Archive unsigned iOS app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/ios/iphoneos/Runner.app
          build/ios/iphoneos/mediguide-ios-unsigned.zip

      - name: Build macOS release
        run: >-
          flutter build macos --release
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Archive macOS app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/macos/Build/Products/Release/MediGuide.app
          build/macos/Build/Products/Release/mediguide-macos.zip

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-apple-unsigned-${{ github.run_id }}
          path: |
            user_app/build/ios/iphoneos/mediguide-ios-unsigned.zip
            user_app/build/macos/Build/Products/Release/mediguide-macos.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - web
      - apple
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the complete GHCR release set
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${RELEASE_TAG#v}"
          for package in \
            mediguide-pos-api \
            mediguide-pos-ai-worker \
            mediguide-pos-dashboard \
            mediguide-pos-guidelines; do
            image="ghcr.io/${owner}/${package}:${version}"
            ready=false
            for attempt in $(seq 1 45); do
              if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 20
            done
            if [ "${ready}" != true ]; then
              echo "Timed out waiting for ${image}." >&2
              exit 1
            fi
          done

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mediguide-*
          path: release-artifacts

      - name: Assemble release bundle and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          mobile_full_version="$(sed -n 's/^version:[[:space:]]*//p' user_app/pubspec.yaml | head -n 1)"
          mobile_version="${mobile_full_version%%+*}"
          mobile_build_number="${mobile_full_version##*+}"
          if [ "${mobile_version}" != "${version}" ] || [ "${mobile_build_number}" = "${mobile_full_version}" ]; then
            echo "Invalid mobile release metadata: ${mobile_full_version}." >&2
            exit 1
          fi
          mobile_artifact_version="${mobile_version}+${mobile_build_number}"
          owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          apk="$(find release-artifacts -name app-release.apk -print -quit)"
          aab="$(find release-artifacts -name app-release.aab -print -quit)"
          ios="$(find release-artifacts -name mediguide-ios-unsigned.zip -print -quit)"
          macos="$(find release-artifacts -name mediguide-macos.zip -print -quit)"
          web="$(find release-artifacts -type d -name 'mediguide-web-*' -print -quit)"

          test -n "${apk}" && test -n "${aab}" && test -n "${ios}" && test -n "${macos}" && test -n "${web}"
          cp "${apk}" "dist/mediguide-${mobile_artifact_version}-android.apk"
          cp "${aab}" "dist/mediguide-${mobile_artifact_version}-android.aab"
          cp "${ios}" "dist/mediguide-${mobile_artifact_version}-ios-unsigned.zip"
          cp "${macos}" "dist/mediguide-${mobile_artifact_version}-macos-unsigned.zip"
          tar -C "${web}" -czf "dist/mediguide-${mobile_artifact_version}-web.tar.gz" .

          printf '%s\n' \
            "release_tag=${RELEASE_TAG}" \
            "platform_version=${version}" \
            "mobile_version=${mobile_version}" \
            "mobile_build_number=${mobile_build_number}" \
            "mobile_full_version=${mobile_full_version}" \
            "git_revision=${GITHUB_SHA}" \
            "api_image=ghcr.io/${owner}/mediguide-pos-api:${version}" \
            "ai_worker_image=ghcr.io/${owner}/mediguide-pos-ai-worker:${version}" \
            "dashboard_image=ghcr.io/${owner}/mediguide-pos-dashboard:${version}" \
            "guidelines_image=ghcr.io/${owner}/mediguide-pos-guidelines:${version}" \
            > "dist/mediguide-${version}-release-manifest.txt"
          printf '%s\n' \
            "## MediGuide ${RELEASE_TAG}" \
            "" \
            "Mobile version: ${mobile_version} (build ${mobile_build_number})." \
            "" \
            "The Android APK and AAB are signed with the configured upload key." \
            "The iOS and macOS archives are unsigned verification artifacts and are not store-ready." \
            "Use the release manifest for immutable GHCR image references and verify every download with SHA256SUMS." \
            > dist/ARTIFACT-NOTES.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: dist/ARTIFACT-NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
