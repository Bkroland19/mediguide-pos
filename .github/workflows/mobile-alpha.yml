name: Release mobile prerelease

on:
  workflow_call:
    inputs:
      channel:
        required: false
        default: alpha
        type: string
      destination:
        required: false
        default: all
        type: string
      sequence_number:
        required: false
        type: string
      release_notes:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      destination:
        description: Alpha distribution destination
        required: true
        default: all
        type: choice
        options:
          - all
          - firebase-android
          - firebase-ios
          - testflight
      alpha_number:
        description: Optional human-facing alpha sequence (defaults to workflow run number)
        required: false
        type: string
      release_notes:
        description: Optional notes appended to the generated alpha metadata
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-${{ inputs.channel || 'alpha' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  metadata:
    name: Allocate prerelease metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      alpha_number: ${{ steps.metadata.outputs.alpha_number }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
      channel: ${{ steps.metadata.outputs.channel }}
      tester_groups: ${{ steps.metadata.outputs.tester_groups }}
    steps:
      - name: Require canonical main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Mobile alpha releases must be dispatched from main, not ${GITHUB_REF}." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Derive unique prerelease version
        id: metadata
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'alpha' }}
          REQUESTED_SEQUENCE_NUMBER: ${{ inputs.sequence_number || inputs.alpha_number }}
          EXTRA_RELEASE_NOTES: ${{ inputs.release_notes }}
        working-directory: user_app
        run: |
          set -euo pipefail
          full_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          app_version="${full_version%%+*}"
          current_build="${full_version##*+}"
          channel="${RELEASE_CHANNEL:-alpha}"
          sequence_number="${REQUESTED_SEQUENCE_NUMBER:-${GITHUB_RUN_NUMBER}}"

          if [ "${channel}" != "alpha" ] && [ "${channel}" != "beta" ]; then
            echo "Prerelease channel must be alpha or beta." >&2
            exit 1
          fi
          if ! [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Prerelease builds require a numeric Flutter app version; found ${app_version}." >&2
            exit 1
          fi
          if ! [[ "${current_build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "pubspec.yaml must contain a positive Flutter build number." >&2
            exit 1
          fi
          if ! [[ "${sequence_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The prerelease sequence number must be a positive integer." >&2
            exit 1
          fi

          # Include the checked-in store build plus the workflow run/attempt.
          # This remains monotonic across alpha runs and gives a rerun a new
          # value instead of resubmitting a rejected TestFlight build.
          channel_offset=0
          if [ "${channel}" = "beta" ]; then
            # Alpha and beta are separate caller workflows and therefore have
            # independent run-number sequences. Reserve a beta range so their
            # store builds cannot collide.
            channel_offset=100000
          fi
          allocated_build=$((current_build + channel_offset + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "${allocated_build}" -gt 2100000000 ]; then
            echo "Allocated build number exceeds the Android versionCode limit." >&2
            exit 1
          fi

          notes="MediGuide ${app_version} ${channel}.${sequence_number} (build ${allocated_build}, ${GITHUB_SHA::12})"
          extra_notes="$(printf '%s' "${EXTRA_RELEASE_NOTES}" | tr '\r\n' '  ')"
          if [ -n "${extra_notes}" ]; then
            notes="${notes}. ${extra_notes}"
          fi

          {
            echo "app_version=${app_version}"
            echo "alpha_number=${sequence_number}"
            echo "build_number=${allocated_build}"
            echo "channel=${channel}"
            echo "tester_groups=mediguide-${channel}-testers"
            echo "release_notes=${notes}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## Mobile ${channel}.${sequence_number}"
            echo
            echo "- App version: ${app_version}"
            echo "- Store build: ${allocated_build}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Destination: ${{ inputs.destination }}"
            echo "- Firebase group: mediguide-${channel}-testers"
            echo "- Production deployment: not triggered"
          } >> "${GITHUB_STEP_SUMMARY}"

  quality:
    name: Test and analyze prerelease
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: user_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Upload golden comparison failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-prerelease-golden-failures-${{ github.run_id }}
          path: user_app/test/failures
          if-no-files-found: ignore
          retention-days: 14

  distribute:
    name: Distribute prerelease to testers
    needs:
      - metadata
      - quality
    uses: ./.github/workflows/mobile-distribution.yml
    with:
      destination: ${{ inputs.destination }}
      api_base_url: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
      release_notes: ${{ needs.metadata.outputs.release_notes }}
      build_number: ${{ needs.metadata.outputs.build_number }}
      tester_groups: ${{ needs.metadata.outputs.tester_groups }}
    secrets: inherit
