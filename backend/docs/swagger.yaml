      language:
        type: string
      page_end:
        type: integer
      page_start:
        type: integer
      program_area:
        type: string
      review_status:
        type: string
      section_id:
        type: string
      source_name:
        type: string
      source_version:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version_id:
        type: string
