      id:
        type: string
      manifest_json:
        type: string
      name:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      version:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      facility_id:
        type: string
      id:
        type: string
      is_active:
