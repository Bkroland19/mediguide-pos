info:
  contact:
    email: admin@mediguide.local
    name: MediGuide Backend
  description: Offline-first clinical guideline backend API for MediGuide.
  license:
    name: Proprietary
  termsOfService: https://mediguide.local/terms
  title: MediGuide Backend API
  version: "1.0"
paths:
  /api/v1/{collection}:
    get:
      description: Legacy v1 collection listing endpoint. Some collections are public
        while others require authentication depending on the collection name.
      parameters:
      - description: Legacy collection name
        enum:
        - medical_guidelines
        - drugs
        - calculators
        - abbreviations
        - emergency_protocols
        - faqs
        - documentation
        - generic_pages
        - guideline_categories
        - guideline_tags
        - drug_categories
        - drug_tags
        - drug_classes
        - therapeutic_categories
        - consultants
        - health_facilities
        - regions
        - districts
        - counties
        - subcounties
        - parishes
        - facility_levels
        - ownership_types
        - authorities
        - ministry_directory
        - languages
        - notifications
        - notification_templates
        - notification_campaigns
        - support_tickets
        - support_ticket_replies
        - conversations
        - messages
        - reading_progress
        - calculator_usage_logs
        - guideline_usage_logs
        - drug_usage_logs
        - abbreviation_usage_logs
        - consultant_usage_logs
        - facility_usage_logs
        - ai_usage_logs
        in: path
        name: collection
        required: true
        type: string
      - description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Search term alias
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyCollectionListResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List legacy collection records
      tags:
      - legacy-v1
    post:
      consumes:
      - application/json
      description: Legacy v1 collection create endpoint for authenticated user-owned
        resources and compatibility write flows.
      parameters:
      - description: Legacy collection name
        enum:
        - support_tickets
        - support_ticket_replies
        - conversations
        - messages
        - reading_progress
        - calculator_usage_logs
        - guideline_usage_logs
        - drug_usage_logs
        - abbreviation_usage_logs
        - consultant_usage_logs
        - facility_usage_logs
        - ai_usage_logs
        in: path
        name: collection
        required: true
        type: string
      - description: Legacy collection payload
        in: body
        name: payload
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyCollectionItemResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create legacy collection record
      tags:
      - legacy-v1
  /api/v1/{collection}/{id}:
    get:
      description: Legacy v1 collection detail endpoint. Some collections are public
        while others require authentication depending on the collection name.
      parameters:
      - description: Legacy collection name
        enum:
        - medical_guidelines
        - drugs
        - calculators
        - abbreviations
        - emergency_protocols
        - faqs
        - documentation
        - generic_pages
        - guideline_categories
        - guideline_tags
        - drug_categories
        - drug_tags
        - drug_classes
        - therapeutic_categories
        - consultants
        - health_facilities
        - regions
        - districts
        - counties
        - subcounties
        - parishes
        - facility_levels
        - ownership_types
        - authorities
        - ministry_directory
        - languages
        - notifications
        - notification_templates
        - notification_campaigns
        - support_tickets
        - support_ticket_replies
        - conversations
        - messages
        - reading_progress
        - calculator_usage_logs
        - guideline_usage_logs
        - drug_usage_logs
        - abbreviation_usage_logs
        - consultant_usage_logs
        - facility_usage_logs
        - ai_usage_logs
        in: path
        name: collection
        required: true
        type: string
      - description: Record ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyCollectionItemResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get legacy collection record
      tags:
      - legacy-v1
    patch:
      consumes:
