      description:
        type: string
      language:
        type: string
      program_area:
        type: string
      source_org:
        type: string
      title:
        type: string
    type: object
  services.CreateProtocolInput:
    properties:
      code:
        type: string
      definition_yaml:
        type: string
      language:
        type: string
      program_area:
        type: string
      title:
        type: string
      version:
        type: string
