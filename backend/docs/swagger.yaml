      note:
        type: string
      protocol:
        type: string
    type: object
  services.SearchResult:
    properties:
      id:
        type: string
      page_end:
        type: integer
      page_start:
        type: integer
      snippet:
        type: string
      source_name:
        type: string
      source_version:
        type: string
      title:
        type: string
