info:
  contact:
    email: admin@mediguide.local
    name: MediGuide Backend
  description: Offline-first clinical guideline backend API for MediGuide.
  license:
    name: Proprietary
  termsOfService: https://mediguide.local/terms
  title: MediGuide Backend API
  version: "1.0"
paths:
  /api/v1/consultants/tree:
    get:
      description: Legacy v1 endpoint that groups consultants by region, city, then
        specialty.
      parameters:
      - description: Tree level
        in: query
        maximum: 2
        minimum: 0
        name: level
        type: integer
      - description: JSON encoded filters
        in: query
        name: filters
        type: string
      - description: Optional JSON context
        in: query
        name: context
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyTreeResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get consultants tree
      tags:
      - legacy-v1
  /api/v1/health-facilities/tree:
    get:
      description: Legacy v1 endpoint that groups facilities by region, district,
        then facility level.
      parameters:
      - description: Tree level
        in: query
        maximum: 2
        minimum: 0
        name: level
        type: integer
      - description: JSON encoded filters
        in: query
        name: filters
        type: string
      - description: Optional JSON context
        in: query
        name: context
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyTreeResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get health facilities tree
      tags:
      - legacy-v1
  /api/v1/ministry-directory/tree:
    get:
      description: Legacy v1 endpoint that groups ministry directory contacts by region,
        district, then ministry.
      parameters:
      - description: Tree level
        in: query
        maximum: 2
        minimum: 0
        name: level
        type: integer
      - description: JSON encoded filters
        in: query
        name: filters
        type: string
      - description: Optional JSON context
        in: query
        name: context
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyTreeResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get ministry directory tree
      tags:
      - legacy-v1
  /api/v1/overview:
    get:
      description: Dashboard-oriented legacy v1 overview endpoint with metrics, pipeline,
        engagement, support and coverage totals.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyOverviewResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get legacy overview metrics
      tags:
      - legacy-v1
  /api/v1/stats:
    get:
      description: Legacy v1 stats endpoint used by the mobile home screen. Authentication
        is optional, but user-specific message counts are only returned when a valid
        bearer token is provided.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LegacyStatsResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get legacy mobile stats
      tags:
      - legacy-v1
  /api/v2/abbreviations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedAbbreviationsEnvelope'
      security:
      - BearerAuth: []
      summary: List abbreviations
      tags:
      - guideline-content
    post:
      parameters:
      - description: Abbreviation
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/services.AbbreviationInput'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AbbreviationEnvelope'
      security:
      - BearerAuth: []
      summary: Create an abbreviation
      tags:
      - guideline-content
  /api/v2/abbreviations/{id}:
    delete:
      parameters:
      - description: Abbreviation UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Archive an abbreviation
      tags:
      - guideline-content
    get:
      parameters:
      - description: Abbreviation UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AbbreviationEnvelope'
      security:
      - BearerAuth: []
      summary: Get an abbreviation
      tags:
      - guideline-content
    patch:
      parameters:
      - description: Abbreviation UUID
        in: path
        name: id
        required: true
        type: string
      - description: Abbreviation changes
        in: body
        name: payload
        required: true
