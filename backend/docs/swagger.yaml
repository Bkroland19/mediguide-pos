info:
  contact:
    email: admin@mediguide.local
    name: MediGuide Backend
  description: Offline-first clinical guideline backend API for MediGuide.
  license:
    name: Proprietary
  termsOfService: https://mediguide.local/terms
  title: MediGuide Backend API
  version: 2.0.18
paths:
  /api/public/guidelines:
    get:
      parameters:
      - description: Search title, description, or source
        in: query
        name: search
        type: string
      - description: Program area
        in: query
        name: program_area
        type: string
      - description: Country
        in: query
        name: country
        type: string
      - description: Language
        in: query
        name: language
        type: string
      - description: RFC3339 lower update bound
        in: query
        name: updated_from
        type: string
      - description: title, publication_date, last_updated, version, or program_area
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicGuidelinesEnvelope'
      summary: List published guidelines
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicGuidelineEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Get a published guideline
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/algorithms:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicGuidelineAlgorithmsEnvelope'
      summary: List reviewed algorithms in a published guideline
