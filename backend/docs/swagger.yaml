      session_id:
        type: string
    type: object
  services.AskResponse:
    properties:
      answer:
        type: string
      citations:
        items:
          $ref: '#/definitions/services.Citation'
        type: array
      session_id:
        type: string
    type: object
  services.Citation:
    properties:
