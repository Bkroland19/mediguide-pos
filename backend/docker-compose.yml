services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mediguide
      POSTGRES_USER: mediguide
      POSTGRES_PASSWORD: mediguide
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguide -d mediguide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mediguide
      MINIO_ROOT_PASSWORD: mediguide123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: mediguide-backend
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://mediguide:mediguide@postgres:5432/mediguide?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: mediguide
      S3_SECRET_KEY: mediguide123
      S3_BUCKET: mediguide
      S3_USE_SSL: "false"
      AI_RAG_PROVIDER: local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
