services:
  postgres:
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5433}:5432"

  minio:
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"

  guidelines:
    image: "${GUIDELINES_DEV_IMAGE:-mediguide-guidelines:development}"
    build:
      context: ..
      dockerfile: guidelines-platform/Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      VITE_MEDIGUIDE_POS_URL: "${DASHBOARD_PUBLIC_URL:-http://localhost:3000}"
      VITE_MEDIGUIDE_API_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
      VITE_STATIC_GUIDELINE_FALLBACK_ENABLED: "${STATIC_GUIDELINE_FALLBACK_ENABLED:-true}"
      VITE_HOST: 0.0.0.0
      VITE_PORT: 8080
    volumes:
      - ../guidelines-platform:/app
      - guidelines_node_modules:/app/node_modules
    read_only: false
    restart: "no"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  guidelines_node_modules:
