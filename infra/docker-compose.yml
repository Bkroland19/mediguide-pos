name: mediguide

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mediguide
      POSTGRES_USER: mediguide
      POSTGRES_PASSWORD: mediguide
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguide -d mediguide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mediguide
      MINIO_ROOT_PASSWORD: mediguide123
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: mediguide-backend
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://mediguide:mediguide@postgres:5432/mediguide?sslmode=disable
      JWT_SECRET: change-this-secret-ernrjtjtpckrmcjwieutalldjjr8373n1y1y2n2y3y4bdnzmzmz2u
      JWT_ACCESS_TTL_MINUTES: 60
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: mediguide
      S3_SECRET_KEY: mediguide123
      S3_BUCKET: mediguide
      S3_USE_SSL: "false"
      AI_RAG_PROVIDER: worker
      AI_WORKER_URL: http://ai-worker:8090
      AI_WORKER_GRPC_ADDR: ai-worker:50051
      AI_WORKER_TIMEOUT_SECONDS: ${AI_WORKER_TIMEOUT_SECONDS:-120}
      DEFAULT_ADMIN_EMAIL: admin@mediguide.local
      DEFAULT_ADMIN_PASSWORD: Admin123!
    ports:
      - "${API_PUBLIC_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: development
      HTTP_PORT: 8090
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: mediguide
      S3_SECRET_KEY: mediguide123
      S3_BUCKET: mediguide
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully

  ai-worker-loop:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: development
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: postgresql://mediguide:mediguide@postgres:5432/mediguide
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: mediguide
      S3_SECRET_KEY: mediguide123
      S3_BUCKET: mediguide
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully

  dashboard:
    image: oven/bun:1
    working_dir: /app
    command: ["sh", "-lc", "bun install && bun run next dev --hostname 0.0.0.0 --port 3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PUBLIC_PORT:-8080}
      WATCHPACK_POLLING: "true"
    ports:
      - "${DASHBOARD_PUBLIC_PORT:-3000}:3000"
    volumes:
      - ../dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull-models:
    image: curlimages/curl:8.14.1
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_MODEL\",\"stream\":false}"
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_EMBEDDING_MODEL\",\"stream\":false}"

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  dashboard_node_modules:
