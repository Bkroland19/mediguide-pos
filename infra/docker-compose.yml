name: mediguide

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mediguide}"
      POSTGRES_USER: "${POSTGRES_USER:-mediguide}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mediguide}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguide -d mediguide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-mediguide}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-mediguide123}"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: mediguide-backend
      APP_ENV: "${APP_ENV:-production}"
      HTTP_PORT: 8080
      AUTO_SEED: "false"
      STATIC_SAMPLES_DIR: /app/dashboard/samples
      DATABASE_URL: "${DATABASE_URL:-postgres://mediguide:mediguide@postgres:5432/mediguide?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:-development-only-change-this-secret-before-production}"
      JWT_ACCESS_TTL_MINUTES: "${JWT_ACCESS_TTL_MINUTES:-60}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      AI_RAG_PROVIDER: worker
      AI_WORKER_URL: http://ai-worker:8090
      AI_WORKER_GRPC_ADDR: ai-worker:50051
      AI_WORKER_TIMEOUT_SECONDS: ${AI_WORKER_TIMEOUT_SECONDS:-120}
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:-admin@mediguide.local}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-Admin123!}"
    ports:
      - "${API_PUBLIC_PORT:-8080}:8080"
    volumes:
      - ../dashboard/samples:/app/dashboard/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: "${APP_ENV:-production}"
      HTTP_PORT: 8090
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: "${AI_DATABASE_URL:-postgresql://mediguide:mediguide@postgres:5432/mediguide}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully
    restart: unless-stopped

  ai-worker-loop:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: "${APP_ENV:-production}"
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: "${AI_DATABASE_URL:-postgresql://mediguide:mediguide@postgres:5432/mediguide}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PUBLIC_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  guidelines:
    image: "${GUIDELINES_IMAGE:-mediguide-guidelines:production}"
    build:
      context: ..
      dockerfile: guidelines-platform/Dockerfile.prod
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    environment:
      MEDIGUIDE_POS_URL: "${DASHBOARD_PUBLIC_URL:-http://localhost:3000}"
    ports:
      - "${GUIDELINES_PUBLIC_PORT:-8081}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull-models:
    image: curlimages/curl:8.14.1
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_MODEL\",\"stream\":false}"
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_EMBEDDING_MODEL\",\"stream\":false}"

volumes:
  postgres_data:
  minio_data:
  ollama_data:
