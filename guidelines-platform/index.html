<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/coat_of_arms.png" />
    <link rel="apple-touch-icon" href="/coat_of_arms.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediGuide Clinical Guidelines</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("mediguide-theme");
        const dark = savedTheme === "dark" || (!savedTheme && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
